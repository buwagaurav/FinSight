# Netlify: the FinSight website. Set NEXT_PUBLIC_API_URL (your Render API URL) in Site configuration > Environment variables.
[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"   # Netlify's Next.js adapter requires Node 22+
  # NEXT_PUBLIC_API_URL is the public address of the API; it must be in the site's JavaScript. Every other
  # variable is still scanned, so a real secret (an API key) would still block the deploy.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_API_URL"

# Netlify's Next.js adapter. Declared explicitly: without it Netlify serves nothing and every page is a 404.
[[plugins]]
  package = "@netlify/plugin-nextjs"
