# Keeps every NSE company's prices, ratios and statements fresh in the Neon database.
# Needs the repository secret DATABASE_URL (Settings > Secrets and variables > Actions).
name: Refresh market data

on:
  schedule:
    - cron: "30 20 * * *"   # 02:00 IST, after markets close
    - cron: "30 8 * * *"    # 14:00 IST, catches up anything a rate limit left behind
  workflow_dispatch: {}      # "Run workflow" button for a manual refresh

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Load / refresh companies (resumes where the last run stopped)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m app.loader --minutes 50 --workers 2
