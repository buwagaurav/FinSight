# Keeps every NSE and US company's prices, ratios and statements fresh in the Neon database.
# Needs the repository secret DATABASE_URL (Settings > Secrets and variables > Actions).
name: Refresh market data

on:
  schedule:
    - cron: "30 20 * * *"   # 02:00 IST: after Indian markets close, and just after the US close
    - cron: "30 8 * * *"    # 14:00 IST, catches up anything a rate limit left behind
  workflow_dispatch: {}      # "Run workflow" button for a manual refresh

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Load / refresh companies (resumes where the last run stopped)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m app.loader --minutes 50 --workers 2

  documents:
    # Annual reports are large (300+ pages), so they're indexed here rather than on the free API server.
    # Already-indexed documents are skipped; each company keeps only its latest report and 20 newest filings.
    needs: load
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Index annual reports and filings for the 50 largest companies
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m app.docs --top 50

  us-market:
    # US screener: SEC statements weekly (one ~1.4 GB bulk file), closing prices every run (batched Yahoo requests).
    # The first run also looks up each company's SEC industry code once, so it takes longest (~40 min).
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Refresh US companies, statements when due, prices and screener metrics
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m app.us_market

  backtests:
    # Every backtest rule on every Nifty 50 stock (~50 Yahoo requests, about a minute): the "Across Nifty 50"
    # column on the stock page's Backtest tab. Independent of the loader, so it runs even if that job failed.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run every rule across the Nifty 50
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m app.backtest_universe
